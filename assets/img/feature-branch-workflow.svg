  <circle cx="60" cy="70" r="14" fill="#fff4ef" stroke="#333"/><text x="60" y="75" text-anchor="middle" font-size="12" font-weight="600"></text> <circle cx="130" cy="70" r="14" fill="#fff4ef" stroke="#333"/><text x="130" y="75" text-anchor="middle" font-size="12" font-weight="600"></text> <circle cx="330" cy="70" r="14" fill="#fff4ef" stroke="#333"/><text x="330" y="75" text-anchor="middle" font-size="12" font-weight="600"></text> <circle cx="520" cy="70" r="14" fill="#fde68a" stroke="#333"/><text x="520" y="75" text-anchor="middle" font-size="12" font-weight="600">M</text> <circle cx="620" cy="70" r="14" fill="#fff4ef" stroke="#333"/><text x="620" y="75" text-anchor="middle" font-size="12" font-weight="600"></text>
  <circle cx="200" cy="140" r="14" fill="#ede9fe" stroke="#333"/><text x="200" y="145" text-anchor="middle" font-size="12" font-weight="600"></text> <circle cx="270" cy="140" r="14" fill="#ede9fe" stroke="#333"/><text x="270" y="145" text-anchor="middle" font-size="12" font-weight="600"></text> <circle cx="340" cy="140" r="14" fill="#ede9fe" stroke="#333"/><text x="340" y="145" text-anchor="middle" font-size="12" font-weight="600"></text> <circle cx="400" cy="140" r="14" fill="#ede9fe" stroke="#333"/><text x="400" y="145" text-anchor="middle" font-size="12" font-weight="600"></text>
  <rect x="616" y="27" width="68" height="24" rx="12" fill="#f1502f"/><text x="650" y="44" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">main</text>
  <text x="200" y="176" font-size="12" fill="#7c3aed" font-weight="600">feature/kontaktformular</text>

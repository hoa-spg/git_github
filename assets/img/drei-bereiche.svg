<svg xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" viewBox="0 0 720 320" width="720" height="320">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs>
  <rect width="720" height="320" fill="#fff"/>
  <rect x="10" y="10" width="525" height="300" rx="10" fill="#fafafa" stroke="#ccc" stroke-dasharray="5 4"/>
  <text x="272" y="32" text-anchor="middle" font-weight="600" fill="#555">Dein Rechner (lokal)</text>
  <rect x="555" y="10" width="155" height="300" rx="10" fill="#f6f2ff" stroke="#c4b5fd" stroke-dasharray="5 4"/>
  <text x="632" y="32" text-anchor="middle" font-weight="600" fill="#555">Server</text>
  <rect x="25" y="85" width="145" height="80" rx="8" fill="#fff4ef" stroke="#f1502f"/>
  <text x="97" y="117" text-anchor="middle" font-weight="600">Arbeits-</text>
  <text x="97" y="135" text-anchor="middle" font-weight="600">verzeichnis</text>
  <text x="97" y="154" text-anchor="middle" font-size="11" fill="#666">deine Dateien</text>
  <rect x="200" y="85" width="145" height="80" rx="8" fill="#fff4ef" stroke="#f1502f"/>
  <text x="272" y="117" text-anchor="middle" font-weight="600">Staging Area</text>
  <text x="272" y="135" text-anchor="middle" font-size="12">(Index)</text>
  <text x="272" y="154" text-anchor="middle" font-size="11" fill="#666">nächster Commit</text>
  <rect x="375" y="85" width="145" height="80" rx="8" fill="#fff4ef" stroke="#f1502f"/>
  <text x="447" y="117" text-anchor="middle" font-weight="600">Lokales</text>
  <text x="447" y="135" text-anchor="middle" font-weight="600">Repository</text>
  <text x="447" y="154" text-anchor="middle" font-size="11" fill="#666">Ordner .git</text>
  <rect x="565" y="85" width="135" height="80" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="632" y="117" text-anchor="middle" font-weight="600">Remote</text>
  <text x="632" y="135" text-anchor="middle" font-weight="600">Repository</text>
  <text x="632" y="154" text-anchor="middle" font-size="11" fill="#666">z. B. GitHub</text>
  <line x1="170" y1="70" x2="198" y2="70" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="184" y="60" text-anchor="middle" font-family="Consolas, monospace" font-size="13">add</text>
  <line x1="345" y1="70" x2="373" y2="70" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="359" y="60" text-anchor="middle" font-family="Consolas, monospace" font-size="13">commit</text>
  <line x1="520" y1="70" x2="563" y2="70" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="541" y="60" text-anchor="middle" font-family="Consolas, monospace" font-size="13">push</text>
  <line x1="632" y1="165" x2="632" y2="215" stroke="#333" stroke-width="1.5"/>
  <line x1="632" y1="215" x2="99" y2="215" stroke="#333" stroke-width="1.5"/>
  <line x1="97" y1="215" x2="97" y2="168" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="250" y="207" text-anchor="middle" font-family="Consolas, monospace" font-size="13">pull</text>
  <text x="250" y="234" text-anchor="middle" font-size="12" fill="#555">holt neue Commits und übernimmt sie in Repository und Arbeitsverzeichnis</text>
  <line x1="680" y1="165" x2="680" y2="270" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="680" y1="270" x2="502" y2="270" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="500" y1="270" x2="500" y2="168" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <text x="590" y="262" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#555">clone</text>
  <text x="590" y="290" text-anchor="middle" font-size="12" fill="#555">einmalig: komplette Kopie holen</text>
</svg>

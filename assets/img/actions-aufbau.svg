<svg xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" viewBox="0 0 720 300" width="720" height="300">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="720" height="300" fill="#fff"/>
  <rect x="15" y="110" width="120" height="70" rx="8" fill="#fff4ef" stroke="#f1502f"/>
  <text x="75" y="136" text-anchor="middle" font-weight="600">Event</text>
  <text x="75" y="155" text-anchor="middle" font-size="12" font-family="Consolas, monospace">push</text>
  <text x="75" y="170" text-anchor="middle" font-size="12" font-family="Consolas, monospace">pull_request</text>
  <line x1="135" y1="145" x2="163" y2="145" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="165" y="15" width="540" height="270" rx="10" fill="#f6f2ff" stroke="#7c3aed"/>
  <text x="180" y="38" font-weight="700">Workflow</text>
  <text x="255" y="38" font-size="12" font-family="Consolas, monospace" fill="#555">.github/workflows/ci.yml</text>
  <rect x="180" y="55" width="250" height="215" rx="8" fill="#fff" stroke="#999"/>
  <text x="195" y="78" font-weight="600">Job „test“</text>
  <text x="195" y="96" font-size="12" font-family="Consolas, monospace" fill="#555">runs-on: ubuntu-latest</text>
  <g font-size="12" font-family="Consolas, monospace">
    <rect x="195" y="108" width="220" height="30" rx="4" fill="#fafafa" stroke="#ccc"/><text x="205" y="128">Step: actions/checkout</text>
    <rect x="195" y="146" width="220" height="30" rx="4" fill="#fafafa" stroke="#ccc"/><text x="205" y="166">Step: actions/setup-node</text>
    <rect x="195" y="184" width="220" height="30" rx="4" fill="#fafafa" stroke="#ccc"/><text x="205" y="204">Step: npm ci</text>
    <rect x="195" y="222" width="220" height="30" rx="4" fill="#fafafa" stroke="#ccc"/><text x="205" y="242">Step: npm test</text>
  </g>
  <line x1="430" y1="160" x2="473" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="451" y="150" text-anchor="middle" font-size="11" font-family="Consolas, monospace">needs</text>
  <rect x="475" y="55" width="215" height="215" rx="8" fill="#fff" stroke="#999"/>
  <text x="490" y="78" font-weight="600">Job „deploy“</text>
  <text x="490" y="96" font-size="12" font-family="Consolas, monospace" fill="#555">runs-on: ubuntu-latest</text>
  <g font-size="12" font-family="Consolas, monospace">
    <rect x="490" y="108" width="185" height="30" rx="4" fill="#fafafa" stroke="#ccc"/><text x="500" y="128">Step: checkout</text>
    <rect x="490" y="146" width="185" height="30" rx="4" fill="#fafafa" stroke="#ccc"/><text x="500" y="166">Step: build</text>
    <rect x="490" y="184" width="185" height="30" rx="4" fill="#fafafa" stroke="#ccc"/><text x="500" y="204">Step: deploy</text>
  </g>
  <text x="583" y="245" text-anchor="middle" font-size="11" fill="#555">startet erst, wenn</text>
  <text x="583" y="259" text-anchor="middle" font-size="11" fill="#555">„test“ erfolgreich war</text>
</svg>
